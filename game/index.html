<!doctype html>
<html lang="en">
<head>

<title>Sunfall City — an original open-world crime game</title>
<style>

  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sunfall City: explore the city on foot and by car, take jobs for Del, outrun the Sunfall PD"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
